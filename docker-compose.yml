version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: urbanverse-db
    environment:
      POSTGRES_USER: urbanverse
      POSTGRES_PASSWORD: urbanverse_password
      POSTGRES_DB: urbanversedb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
